<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klebb - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 40px; margin-bottom: 16px; }
    .title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--text-inverse);
    }
    .btn-primary:hover { background: #38bdf8; }
    .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
    .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 16px;
      display: none;
    }
    .error.show { display: block; }
    .recovery {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .recovery.show { display: block; }
    .recovery a { color: var(--accent); }
    .face-id-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.8;
    }
  </style>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="card">
    <div class="logo">♥</div>
    <div class="title">Klebb</div>
    <div class="subtitle" id="subtitle">Authenticate to continue</div>
    <div class="face-id-icon" id="face-id-icon">🔐</div>
    <button class="btn btn-primary" id="login-btn" onclick="login()">
      Sign in with Passkey
    </button>
    <div class="error" id="error"></div>
    <div class="recovery" id="recovery"></div>
  </div>

  <script type="module">
    import { authenticate } from '/js/lib/webauthn-ceremony.js';

    // Filled from /auth/status; used to word the recovery hint.
    let isCloud = false;

    // Lost all passkeys? Recovery is always the same mechanism: a fresh
    // single-use invite opens /setup. Where that invite comes from depends
    // on the deployment, so the copy branches on the hosting mode.
    function showRecovery() {
      const recovery = document.getElementById('recovery');
      recovery.innerHTML = isCloud
        ? 'Lost access to your passkeys? Recover from your hosting account: '
          + 'sign in to the service you subscribed through and request a new '
          + 'sign-in link. It emails you a fresh setup link for this dashboard.'
        : 'Lost access to your passkeys? Registration reopens with a fresh '
          + 'single-use invite: run <code>node scripts/invite.js</code> where '
          + 'this instance is installed and open the printed link.';
      recovery.classList.add('show');
    }

    window.login = async function() {
      const btn = document.getElementById('login-btn');
      const error = document.getElementById('error');
      error.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      try {
        await authenticate();
        window.location.href = '/';
      } catch (e) {
        error.textContent = e.message || 'Authentication failed';
        error.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign in with Passkey';
        showRecovery();
      }
    };

    window.demoLogin = async function() {
      const btn = document.getElementById('login-btn');
      const error = document.getElementById('error');
      error.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Loading demo...';
      try {
        const r = await fetch('/auth/demo-login', { method: 'POST' });
        const result = await r.json();
        if (!r.ok || !result.ok) throw new Error(result.error || 'Demo login failed');
        window.location.href = '/';
      } catch (e) {
        error.textContent = e.message || 'Demo login failed';
        error.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Enter the demo';
      }
    };

    // Branch on demo mode: if the server is in demo mode, swap the
    // passkey CTA for an "Enter the demo" button and skip auto-trigger.
    (async () => {
      try {
        const r = await fetch('/auth/status');
        const s = await r.json();
        isCloud = !!s.cloud;
        if (s.demo) {
          document.getElementById('subtitle').textContent = 'Public demo. No account needed.';
          document.getElementById('face-id-icon').textContent = '👋';
          const btn = document.getElementById('login-btn');
          btn.textContent = 'Enter the demo';
          btn.setAttribute('onclick', 'demoLogin()');
          return;
        }
      } catch {}
      // Default: passkey flow, auto-trigger so Face ID prompts immediately.
      setTimeout(() => window.login(), 500);
    })();
  </script>
</body>
</html>
