<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klebb - Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 40px; margin-bottom: 16px; }
    .title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
    .steps {
      text-align: left;
      margin: 20px 0 28px;
      padding: 16px 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      font-size: 14px;
      color: #475569;
    }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 212, 170, 0.15);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--text-inverse);
    }
    .btn-primary:hover { background: #38bdf8; }
    .btn-primary:disabled { background: #333; color: #666; cursor: not-allowed; }
    .error {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 16px;
      display: none;
    }
    .error.show { display: block; }
    .success {
      color: var(--accent);
      font-size: 14px;
      margin-top: 16px;
      display: none;
    }
    .success.show { display: block; }
  </style>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="card">
    <div class="logo">♥</div>
    <div class="title">Klebb Setup</div>
    <div class="subtitle">Register a passkey to secure your health dashboard</div>
    <div class="steps">
      <div class="step">
        <span class="step-num">1</span>
        <span>Tap the button below</span>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <span>Authenticate with Face ID or fingerprint</span>
      </div>
      <div class="step">
        <span class="step-num">3</span>
        <span>You're in. Future logins use biometrics.</span>
      </div>
    </div>
    <button class="btn btn-primary" id="register-btn" onclick="register()">
      Register Passkey
    </button>
    <div class="error" id="error"></div>
    <div class="success" id="success">✅ Passkey registered! Redirecting...</div>
  </div>

  <script type="module">
    import { registerCredential, checkRegisterAvailable } from '/js/lib/webauthn-ceremony.js';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    // Check registration availability on load
    (async () => {
      const error = document.getElementById('error');
      const btn = document.getElementById('register-btn');
      const j = await checkRegisterAvailable(code);
      if (!j.available) {
        btn.disabled = true;
        btn.textContent = 'Registration closed';
        if (j.reason === 'invalid-invite') {
          error.textContent = 'This invite link is invalid or expired. Invites are single-use: get a fresh one from wherever this one came from (your hosting account, the person who runs this instance, or scripts/invite.js if that is you).';
        } else if (j.reason === 'awaiting-invite') {
          error.textContent = 'This instance is waiting for its setup link. Check the email from klebb.app to register your first passkey.';
        } else {
          error.textContent = 'Registration is closed. An invite code is required.';
        }
        error.classList.add('show');
      } else if (j.label) {
        const subtitle = document.querySelector('.subtitle');
        if (subtitle) subtitle.textContent = `Register a passkey for ${j.label}`;
      }
    })();

    window.register = async function() {
      const btn = document.getElementById('register-btn');
      const error = document.getElementById('error');
      const success = document.getElementById('success');
      error.classList.remove('show');
      success.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Registering...';

      try {
        await registerCredential({ code });
        success.classList.add('show');
        setTimeout(() => { window.location.href = '/'; }, 1500);
      } catch (e) {
        error.textContent = e.message || 'Registration failed';
        error.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Register Passkey';
      }
    };
  </script>
</body>
</html>
