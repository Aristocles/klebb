# SPDX-License-Identifier: AGPL-3.0-only
name: Queue native storage (API35 AOSP emulator)

on:
  push:
    branches: [main, feat/811-health-queue-storage]
    paths: ['android/**', '.github/workflows/android-queue-native.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-queue-native.yml']

permissions:
  contents: read

jobs:
  queue-native:
    name: Queue native storage on API35 AOSP emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QUEUE_PHASE: final-seven
    steps:
      - name: Set isolated Android paths from the runner environment
        shell: bash
        run: |
          printf '%s\n' \
            "ANDROID_SDK_ROOT=$RUNNER_TEMP/queue-android-sdk" \
            "ANDROID_USER_HOME=$RUNNER_TEMP/queue-android-user" \
            "ANDROID_AVD_HOME=$RUNNER_TEMP/queue-avd" \
            "QUEUE_EMULATOR_ROOT=$RUNNER_TEMP/queue-android-sdk/queue-pinned-emulator/emulator" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test isolated queue installer preflight
        run: python3 -I -S -B android/tools/test-queue-preflight.py --workflow .github/workflows/android-queue-native.yml
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-disabled: true
      - name: Install the emulator PulseAudio runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libpulse0
          dpkg-query --show --showformat='${Package}=${Version}\n' libpulse0
      - name: Install pinned official packages into the isolated SDK
        run: |
          test "$ANDROID_HOME" = "$RUNNER_TEMP/queue-android-sdk"
          test ! -L "$ANDROID_HOME"
          sdk_real="$(realpath -e -- "$ANDROID_HOME")"
          runner_temp_real="$(realpath -e -- "$RUNNER_TEMP")"
          test "$sdk_real" = "$runner_temp_real/queue-android-sdk"
          test ! -e "$ANDROID_HOME/emulator"
          test ! -L "$ANDROID_HOME/emulator"
          pinned_root="$ANDROID_HOME/queue-pinned-emulator"
          test "$QUEUE_EMULATOR_ROOT" = "$pinned_root/emulator"
          test ! -e "$pinned_root"
          test ! -L "$pinned_root"
          test ! -e "$QUEUE_EMULATOR_ROOT"
          test ! -L "$QUEUE_EMULATOR_ROOT"
          test "$(realpath -m -- "$pinned_root")" = "$sdk_real/queue-pinned-emulator"
          archive="$RUNNER_TEMP/emulator-linux_x64-16428233.zip"
          test ! -e "$archive"
          test ! -L "$archive"
          cli="$ANDROID_HOME/cmdline-tools/16111833/bin/android"
          "$cli" --sdk="$ANDROID_HOME" sdk --ignore-outdated-xmls install platform-tools@37.0.1
          "$cli" --sdk="$ANDROID_HOME" sdk --ignore-outdated-xmls install platforms/android-37.0@2.0.0
          "$cli" --sdk="$ANDROID_HOME" sdk --ignore-outdated-xmls install build-tools/36.0.0@36.0.0
          curl --fail --location --silent --show-error --max-time 600 \
            --max-filesize 349654171 --output "$archive" \
            https://dl.google.com/android/repository/emulator-linux_x64-16428233.zip
          test "$(wc -c < "$archive")" -eq 349654171
          printf '%s  %s\n' \
            'b08fc43d8608d2955f607f1b287beb525041e730086bdca3af152accac3af9c1' "$archive" \
            | sha256sum --check --strict
          unzip -q "$archive" -d "$pinned_root"
          "$cli" --sdk="$ANDROID_HOME" sdk --ignore-outdated-xmls install system-images/android-35/default/x86_64@2.0.0
      - name: Require Linux KVM and create one fresh credential-free AOSP target
        run: |
          # Reclaim only the unused hosted SDK; retain the isolated pinned toolchain.
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$ANDROID_HOME" = "$RUNNER_TEMP/queue-android-sdk"
          test ! -L "$ANDROID_HOME"
          sdk_real="$(realpath -e -- "$ANDROID_HOME")"
          runner_temp_real="$(realpath -e -- "$RUNNER_TEMP")"
          test "$sdk_real" = "$runner_temp_real/queue-android-sdk"
          cli="$sdk_real/cmdline-tools/16111833/bin/android"
          stock_sdk=/usr/local/lib/android/sdk
          test -d "$stock_sdk"
          test ! -L "$stock_sdk"
          test "$(realpath -e -- "$stock_sdk")" = "$stock_sdk"
          test "$ANDROID_SDK_ROOT" = "$ANDROID_HOME"
          test "$(realpath -e -- "$ANDROID_HOME")" = "$sdk_real"
          test -x "$cli"
          test -x "$sdk_real/platform-tools/adb"
          test -x "$QUEUE_EMULATOR_ROOT/emulator"
          test ! -e android/local.properties
          test ! -L android/local.properties
          for selected in "$sdk_real" "$cli" "$sdk_real/platform-tools/adb" "$QUEUE_EMULATOR_ROOT/emulator" "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$GITHUB_WORKSPACE" "$JAVA_HOME"; do
            resolved="$(realpath -m -- "$selected")"
            case "$resolved/" in "$stock_sdk/"*) exit 1 ;; esac
            case "$stock_sdk/" in "$resolved/"*) exit 1 ;; esac
          done
          test "$(realpath -e -- "$(command -v java)")" = "$(realpath -e -- "$JAVA_HOME/bin/java")"
          test "$(stat -c %d -- "$stock_sdk")" = "$(stat -c %d -- "$runner_temp_real")"
          df -Pm -- "$runner_temp_real"
          sudo rm -rf --one-file-system -- /usr/local/lib/android/sdk
          test ! -e /usr/local/lib/android/sdk
          test ! -L /usr/local/lib/android/sdk
          df -Pm -- "$runner_temp_real"
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          test ! -e "$ANDROID_AVD_HOME/KlebbQueueAosp35.avd"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/16111833/bin/avdmanager" create avd \
            --name KlebbQueueAosp35 --package 'system-images;android-35;default;x86_64' \
            --tag default --abi x86_64 --path "$ANDROID_AVD_HOME/KlebbQueueAosp35.avd"
      - name: Run the frozen software and selected native checks once
        run: python3 android/tools/run-queue-native.py "$QUEUE_PHASE"
      - name: Retain original native exits, status bundles and populated encrypted artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: queue-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/build/queue-native-evidence
            android/app/build/test-results/testDebugUnitTest
            android/app/schemas
          if-no-files-found: warn
